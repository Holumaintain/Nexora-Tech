    <!-- =====================================================
     SECTION LOADER
====================================================== -->

    <script>
      /**
       * Load an individual homepage section.
       *
       * @param {string} id
       * @param {string} file
       */
      async function loadSection(id, file) {
        const element = document.getElementById(id);

        if (!element) {
          console.error(`Nexora: Section container "#${id}" was not found.`);

          return;
        }

        try {
          const response = await fetch(file);

          if (!response.ok) {
            throw new Error(`HTTP ${response.status} while loading ${file}`);
          }

          const html = await response.text();

          element.innerHTML = html;
        } catch (error) {
          console.error(`Nexora: Failed to load section "${id}".`, error);

          element.innerHTML = "";
        }
      }

      /**
       * Homepage sections.
       *
       * Keep section markup inside the /sections directory.
       */
      const homepageSections = [
        {
          id: "hero",
          file: "sections/hero.html",
        },

        {
          id: "technologies",
          file: "sections/technologies.html",
        },

        {
          id: "services",
          file: "sections/services.html",
        },

        {
          id: "about",
          file: "sections/about.html",
        },

        {
          id: "stats",
          file: "sections/stats.html",
        },

        {
          id: "why-us",
          file: "sections/why-us.html",
        },

        {
          id: "team",
          file: "sections/team.html",
        },

        {
          id: "testimonials",
          file: "sections/testimonials.html",
        },

        {
          id: "blog",
          file: "sections/blog.html",
        },

        {
          id: "cta",
          file: "sections/cta.html",
        },

        {
          id: "newsletter",
          file: "sections/newsletter.html",
        },
      ];

      /**
       * Load all homepage sections.
       */
      async function loadSections() {
        await Promise.all(
          homepageSections.map(({ id, file }) => loadSection(id, file)),
        );

        /**
         * Notify other scripts that all homepage sections
         * have been inserted into the DOM.
         */
        document.dispatchEvent(new CustomEvent("nexora:sections-loaded"));
      }

      /**
       * Start homepage initialization.
       */
      document.addEventListener("DOMContentLoaded", () => {
        loadSections();
      });
    </script>
