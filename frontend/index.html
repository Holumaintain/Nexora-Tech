<!--=====================
JS
======================-->

<script>
async function loadSection(id,file){

try{

const response = await fetch(file);

if(!response.ok){

throw new Error(`Cannot load ${file}`);

}

const element=document.getElementById(id);

if(element){

element.innerHTML = await response.text();

}


}catch(error){

console.error(error);

}

}



async function loadSections(){

await Promise.all([

loadSection("hero","sections/hero.html"),

loadSection("technologies","sections/technologies.html"),

loadSection("services","sections/services.html"),

loadSection("about","sections/about.html"),

loadSection("stats","sections/stats.html"),

loadSection("why-us","sections/why-us.html"),

loadSection("team","sections/team.html"),

loadSection("testimonials","sections/testimonials.html"),

loadSection("blog","sections/blog.html"),

loadSection("cta","sections/cta.html"),

loadSection("newsletter","sections/newsletter.html")

]);


}



document.addEventListener(
"DOMContentLoaded",
()=>{

loadSections();

}
);

</script>
