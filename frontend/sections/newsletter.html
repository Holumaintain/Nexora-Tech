<section class="newsletter">
    <div class="section">
        <div class="newsletter-container fade-in">
            <span class="section-badge">NEWSLETTER</span>

            <h2 class="section-title">
                Stay Updated With
                Nexora Technologies
            </h2>

            <p class="section-description">
                Subscribe to receive technology insights, product updates,
                software engineering tips and exclusive industry news directly
                in your inbox.
            </p>

            <form class="newsletter-form">

                <div class="newsletter-input">
