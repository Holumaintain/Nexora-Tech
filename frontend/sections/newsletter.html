<!-- =========================================
     NEWSLETTER
========================================= -->

<section id="newsletter" class="newsletter">
  <div class="section">
    <div class="newsletter-inner fade-in">
      <div class="newsletter-content">
        <span class="section-badge"> NEXORA INSIGHTS </span>

        <h2>
          Stay close to
          <span>what's next.</span>
        </h2>

        <p>
          Get occasional insights about software engineering, AI, cloud
          infrastructure, DevOps, automation, and digital product development.
        </p>
      </div>

      <form class="newsletter-form" id="newsletter-form">
        <label for="newsletter-email" class="sr-only"> Email address </label>

        <input
          type="email"
          id="newsletter-email"
          name="email"
          placeholder="Enter your email address"
          autocomplete="email"
          required
        />

        <button type="submit" class="cta-button">
          Subscribe
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <p class="newsletter-note">
        No spam. Just useful technology and product insights.
      </p>
    </div>
  </div>
</section>
