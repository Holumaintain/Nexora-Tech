services:
  - type: web
    name: nexora-backend
    runtime: node
    plan: free

    rootDir: backend

    buildCommand: npm ci && npm run build
    startCommand: npm start

    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      - key: CLIENT_URL
        sync: false

      - key: MONGODB_URI
        sync: false

      - key: JWT_SECRET
        sync: false

      - key: JWT_EXPIRES_IN
        value: 7d

      - key: SMTP_HOST
        sync: false

      - key: SMTP_PORT
        value: 587

      - key: SMTP_USER
        sync: false

      - key: SMTP_PASS
        sync: false

      - key: MAIL_FROM
        sync: false

      - key: CONTACT_RECEIVER
        sync: false