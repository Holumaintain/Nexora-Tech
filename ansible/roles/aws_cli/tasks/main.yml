---
- name: Install AWS CLI installer prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - unzip
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Download AWS CLI v2 installer
  ansible.builtin.get_url:
    url: "https://awscli.amazonaws.com/awscli-exe-linux-{{ aws_cli_arch }}.zip"
    dest: /tmp/awscliv2.zip
    mode: "0644"

- name: Extract AWS CLI v2 installer
  ansible.builtin.unarchive:
    src: /tmp/awscliv2.zip
    dest: /tmp
    remote_src: true
    creates: /tmp/aws/install

- name: Install AWS CLI v2
  ansible.builtin.command:
    cmd: /tmp/aws/install
    creates: /usr/local/bin/aws

- name: Remove AWS CLI installer archive
  ansible.builtin.file:
    path: /tmp/awscliv2.zip
    state: absent

- name: Remove extracted AWS CLI installer
  ansible.builtin.file:
    path: /tmp/aws
    state: absent
